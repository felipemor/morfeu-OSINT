version: "3.9"

networks:
  pentest-net:
    driver: bridge
  pentest-lab:
    driver: bridge
    internal: true  # Lab is isolated from internet

volumes:
  postgres_data:
  redis_data:
  screenshots_data:
  reports_data:
  grafana_data:
  prometheus_data:

services:
  # ─────────────────────────────────────────────
  # DATABASE
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: pentest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pentest}
      POSTGRES_USER: ${POSTGRES_USER:-pentest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pentest-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pentest}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # CACHE / QUEUE
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: pentest-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme_redis} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - pentest-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme_redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # BACKEND API
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pentest-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-pentest}:${POSTGRES_PASSWORD:-changeme_in_production}@postgres:5432/${POSTGRES_DB:-pentest}
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER:-pentest}:${POSTGRES_PASSWORD:-changeme_in_production}@postgres:5432/${POSTGRES_DB:-pentest}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme_redis}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-CHANGE_THIS_TO_A_SECURE_RANDOM_KEY_64_CHARS}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - SCREENSHOTS_DIR=/data/screenshots
      - REPORTS_DIR=/data/reports
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:11434}
      - LLM_MODEL=${LLM_MODEL:-llama3.2}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - screenshots_data:/data/screenshots
      - reports_data:/data/reports
    ports:
      - "8000:8000"
    networks:
      - pentest-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─────────────────────────────────────────────
  # CELERY WORKER
  # ─────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: pentest-worker
    restart: unless-stopped
    command: celery -A app.agents.celery_app worker --loglevel=info --concurrency=4 -Q default,recon,crawler,vuln,screenshot,report
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-pentest}:${POSTGRES_PASSWORD:-changeme_in_production}@postgres:5432/${POSTGRES_DB:-pentest}
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER:-pentest}:${POSTGRES_PASSWORD:-changeme_in_production}@postgres:5432/${POSTGRES_DB:-pentest}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme_redis}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-CHANGE_THIS_TO_A_SECURE_RANDOM_KEY_64_CHARS}
      - SCREENSHOTS_DIR=/data/screenshots
      - REPORTS_DIR=/data/reports
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:11434}
      - LLM_MODEL=${LLM_MODEL:-llama3.2}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Allow worker to reach lab targets
      - LAB_NETWORK=pentest-lab
    volumes:
      - screenshots_data:/data/screenshots
      - reports_data:/data/reports
    networks:
      - pentest-net
      - pentest-lab
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─────────────────────────────────────────────
  # CELERY BEAT (scheduler)
  # ─────────────────────────────────────────────
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: pentest-beat
    restart: unless-stopped
    command: celery -A app.agents.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER:-pentest}:${POSTGRES_PASSWORD:-changeme_in_production}@postgres:5432/${POSTGRES_DB:-pentest}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme_redis}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-CHANGE_THIS_TO_A_SECURE_RANDOM_KEY_64_CHARS}
    networks:
      - pentest-net
    depends_on:
      - redis

  # ─────────────────────────────────────────────
  # FRONTEND
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pentest-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    ports:
      - "3000:3000"
    networks:
      - pentest-net
    depends_on:
      - backend

  # ─────────────────────────────────────────────
  # OBSERVABILITY
  # ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: pentest-prometheus
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    ports:
      - "9090:9090"
    networks:
      - pentest-net

  grafana:
    image: grafana/grafana:latest
    container_name: pentest-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-changeme_grafana}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3300:3000"
    networks:
      - pentest-net
    depends_on:
      - prometheus

  # ─────────────────────────────────────────────
  # LAB — OWASP JUICE SHOP (isolated)
  # ─────────────────────────────────────────────
  juiceshop:
    image: bkimminich/juice-shop:latest
    container_name: pentest-juiceshop
    restart: unless-stopped
    networks:
      pentest-lab:
        aliases:
          - juiceshop
      pentest-net: {}   # backend/worker need to reach it
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      - NODE_ENV=production

  # ─────────────────────────────────────────────
  # FLOWER — Celery monitoring
  # ─────────────────────────────────────────────
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: pentest-flower
    restart: unless-stopped
    command: celery -A app.agents.celery_app flower --port=5555
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme_redis}@redis:6379/0
    ports:
      - "127.0.0.1:5555:5555"
    networks:
      - pentest-net
    depends_on:
      - redis


