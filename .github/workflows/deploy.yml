name: CI/CD Pipeline — Build, Test & Deploy (AWS / GCP / Docker)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-test:
    name: 🧪 Lint & Test (Frontend & Backend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies & Typecheck
        run: |
          cd frontend
          npm ci
          npx tsc --noEmit

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies & Validate
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m py_compile app/main.py app/agents/report_agent.py

  build-and-push-docker:
    name: 🐳 Build & Push Docker Containers
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub (or ECR / GCP Artifact Registry)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend Container
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/morfeusec-backend:latest

      - name: Build & Push Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/morfeusec-frontend:latest

  deploy-aws-gcp:
    name: 🚀 Deploy to Cloud (AWS App Runner / GCP Cloud Run)
    needs: build-and-push-docker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Notify Deployment Status
        run: |
          echo "Despliegue concluído com sucesso nas imagens de container!"
          echo "Imagens atualizadas: morfeusec-backend:latest e morfeusec-frontend:latest"
